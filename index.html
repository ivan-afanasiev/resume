<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV</title>
    <link rel="stylesheet" href="styles.css?v=__VERSION__" />
    <link rel="stylesheet" href="print.css?v=__VERSION__" media="print" />
    <script>
        // Apply theme synchronously before paint to avoid a flash.
        (function () {
            try {
                var saved = localStorage.getItem("cv.theme");
                var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                var theme = saved || (prefersDark ? "dark" : "light");
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
</head>
<body>
    <div class="toolbar">
        <button class="theme-btn" type="button" aria-label="Toggle dark mode" data-theme-toggle>
            <span class="theme-btn__icon" aria-hidden="true"></span>
        </button>
        <button class="download-btn" type="button" aria-label="Download PDF">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2zM12 4l-5 5h3v6h4V9h3l-5-5z"/></svg>
            <span class="download-btn__label"></span>
        </button>
        <nav class="lang-switcher" aria-label="Language"></nav>
    </div>

    <main class="page">
        <header class="header"></header>
        <section class="summary"></section>
        <div class="body">
            <aside class="sidebar"></aside>
            <section class="main-col"></section>
        </div>
    </main>

    <script src="data/cv.en.js?v=__VERSION__"></script>
    <script src="data/cv.ru.js?v=__VERSION__"></script>
    <script src="app.js?v=__VERSION__"></script>
</body>
</html>
